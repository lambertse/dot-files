# Display lazygit
bind -r g display-popup -d '#{pane_current_path}' -w95% -h95% -E lazygit

# Run Claude Code (or opencode inside ~/src/V-OS) in a separate session
bind -r y run-shell '\
  DIR="#{pane_current_path}"; \
  FOLDER=$(basename "$DIR"); \
  HASH=$(echo "$DIR" | md5sum | cut -c1-8); \
  case "$DIR" in \
    "$HOME/src/V-OS"|"$HOME/src/V-OS/"*) PREFIX=opencode; CMD=opencode ;; \
    *) PREFIX=claude; CMD=ai-agent-vm ;; \
  esac; \
  SESSION="$PREFIX-$HASH-$FOLDER"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "$DIR" "$CMD"; \
  tmux display-popup -w95% -h95% -E \
    "tmux attach-session -t $SESSION"'
